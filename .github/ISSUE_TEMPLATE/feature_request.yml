name: Feature request
description: Propose a scoped product or engineering improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or technical problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation
      description: Data, tests, or acceptance criteria needed to evaluate the change.
  - type: textarea
    id: risks
    attributes:
      label: Risks and limitations
