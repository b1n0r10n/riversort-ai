[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riversort-ai"
version = "0.1.0"
description = "Offline decision-support prototype for visual analysis of floating river waste"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "AGPL-3.0-or-later"}
authors = [
  {name = "Bintang Akalla Junjunan"},
  {name = "Nisa Setiawati"},
]
keywords = [
  "computer-vision",
  "river",
  "waste-management",
  "yolo",
  "bytetrack",
  "streamlit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "streamlit==1.52.2",
  "ultralytics==8.3.241",
  "opencv-python==4.12.0.88",
  "pandas==2.3.3",
  "plotly==6.9.0",
  "PyYAML==6.0.3",
  "pydantic==2.12.5",
  "Pillow==13.0.0",
  "ImageHash==4.3.2",
  "lap==0.5.13",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.urls]
Homepage = "https://github.com/b1n0r10n/riversort-ai"
Documentation = "https://github.com/b1n0r10n/riversort-ai/tree/main/docs"
Issues = "https://github.com/b1n0r10n/riversort-ai/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
