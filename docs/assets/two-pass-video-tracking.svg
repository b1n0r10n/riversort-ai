<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two-pass video tracking RiverSort AI</title>
  <desc id="desc">Tahap pertama membentuk track dan kelas final, tahap kedua membuat preview dengan label stabil.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="80" y="78" font-family="DejaVu Sans, Arial" font-size="42" font-weight="700" fill="#0f172a">Video tracking dua tahap</text>
  <text x="80" y="120" font-family="DejaVu Sans, Arial" font-size="22" fill="#475569">Tujuan: satu objek tidak dihitung per frame dan label preview tidak berubah-ubah.</text>

  <rect x="80" y="170" width="1440" height="260" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="3" filter="url(#shadow)"/>
  <text x="115" y="217" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#0e7490">PASS 1 — ANALISIS</text>
  <g font-family="DejaVu Sans, Arial">
    <rect x="115" y="255" width="225" height="105" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <text x="228" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Decode</text>
    <text x="228" y="330" text-anchor="middle" font-size="18" fill="#475569">sampling ≤ 5 FPS</text>

    <rect x="405" y="255" width="225" height="105" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <text x="518" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">YOLO</text>
    <text x="518" y="330" text-anchor="middle" font-size="18" fill="#475569">bbox + class vote</text>

    <rect x="695" y="255" width="225" height="105" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <text x="808" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">ByteTrack</text>
    <text x="808" y="330" text-anchor="middle" font-size="18" fill="#475569">ID lintas frame</text>

    <rect x="985" y="255" width="420" height="105" rx="16" fill="#ffffff" stroke="#06b6d4" stroke-width="2"/>
    <text x="1195" y="296" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Finalisasi track</text>
    <text x="1195" y="329" text-anchor="middle" font-size="18" fill="#475569">confidence-weighted vote → satu kelas final</text>
  </g>
  <path d="M340 307 L395 307" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M630 307 L685 307" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M920 307 L975 307" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1195 372 L1195 480 L400 480 L400 505" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="80" y="515" width="1440" height="245" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="115" y="562" font-family="DejaVu Sans, Arial" font-size="24" font-weight="700" fill="#15803d">PASS 2 — PREVIEW &amp; OUTPUT</text>
  <g font-family="DejaVu Sans, Arial">
    <rect x="115" y="600" width="290" height="105" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="260" y="643" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Decode ulang</text>
    <text x="260" y="675" text-anchor="middle" font-size="18" fill="#475569">frame kronologis</text>

    <rect x="475" y="600" width="360" height="105" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="655" y="641" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Render track terkonfirmasi</text>
    <text x="655" y="674" text-anchor="middle" font-size="18" fill="#475569">ID + kelas final + dukungan vote</text>

    <rect x="905" y="600" width="500" height="105" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="1155" y="641" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Agregasi dan export</text>
    <text x="1155" y="674" text-anchor="middle" font-size="18" fill="#475569">unique count · composition · priority · JSON/CSV</text>
  </g>
  <path d="M405 652 L465 652" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M835 652 L895 652" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="80" y="805" width="1440" height="60" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="800" y="843" text-anchor="middle" font-family="DejaVu Sans, Arial" font-size="21" font-weight="700" fill="#9a3412">Quality gate memberi peringatan jika vote kelas tidak pasti atau mayoritas track terlalu pendek.</text>
</svg>

